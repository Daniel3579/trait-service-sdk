syntax = "proto3";

option go_package = "./gen;trait_pb";

import "google/protobuf/timestamp.proto";
import "trait_requests.proto";
import "trait_responses.proto";

service TraitService {
    rpc Create (UserTrait) returns (UserTrait);
    rpc Read (UIdRequest) returns (UserTrait);
    rpc ReadMultiple (TraitRequest) returns (TMultipleReadResponse);
    rpc Update (UserTrait) returns (UserTrait);
    rpc Delete (UIdRequest) returns (UserTrait);
}

message UserTrait {
    int32 user_id = 1;
    google.protobuf.Timestamp birth_date = 2;
    int32 height = 3;
    int32 weight = 4;
}