syntax = "proto3";

option go_package = "./gen;trait_pb";

import "google/protobuf/timestamp.proto";

message IdRequest {
    int32 user_id = 1;
}

message TraitRequest {
    google.protobuf.Timestamp birth_from = 1;
    google.protobuf.Timestamp birth_to = 2;
    int32 height_from = 3;
    int32 height_to = 4;
    int32 weight_from = 5;
    int32 weight_to = 6;
}